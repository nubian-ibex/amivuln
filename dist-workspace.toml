[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Build provenance attestations for every artifact
github-attestations = true
# Release builds use cargo auditable to embed the dependency list
cargo-auditable = true
# Man pages and shell completions ship inside every archive
include = ["contrib/man", "contrib/completions"]
# Archives
unix-archive = ".tar.zst"
# Create a draft GitHub release; publishing stays a maintainer action
github-release = "announce"
# Only the release workflow runs on tags
pr-run-mode = "plan"
# release.yml is hardened by hand (SHA pins, permissions); do not regenerate it
allow-dirty = ["ci"]

# The musl builds are static, so the build image does not set a glibc floor.
# They run on 24.04, the image the reproducible-build job already uses; the
# gnu builds stay on 22.04 to keep the documented glibc 2.34 baseline.
[dist.github-custom-runners]
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
