[workspace]
changelog_config = "cliff.toml"
git_release_enable = false
git_tag_enable = false
publish = true

# All workspace crates are published (ADR-0003) and share one version. The
# changelog is a single file at the repository root.
[[package]]
name = "amivuln"
changelog_path = "CHANGELOG.md"
changelog_include = ["amivuln-core", "amivuln-resolve", "amivuln-version", "amivuln-sources", "amivuln-cache", "amivuln-report"]
