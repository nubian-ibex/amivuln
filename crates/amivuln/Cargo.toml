[package]
name = "amivuln"
description = "Am I vulnerable? Backport-aware CVE check for binaries, services and packages on this host."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["security", "cve", "vulnerability", "linux"]
categories = ["command-line-utilities"]

[lib]
name = "amivuln"
path = "src/lib.rs"

[[bin]]
name = "amivuln"
path = "src/main.rs"

[dependencies]
amivuln-cache = { path = "../amivuln-cache", version = "0.0.4" }
amivuln-core = { path = "../amivuln-core", version = "0.0.4" }
amivuln-report = { path = "../amivuln-report", version = "0.0.4" }
amivuln-resolve = { path = "../amivuln-resolve", version = "0.0.4" }
amivuln-sources = { path = "../amivuln-sources", version = "0.0.4" }
amivuln-version = { path = "../amivuln-version", version = "0.0.4" }
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6.11"
jiff = { version = "0.2.40", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "display", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = { version = "3.1.4", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "time", "macros"] }
wiremock = "0.6.5"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }

[lints]
workspace = true
