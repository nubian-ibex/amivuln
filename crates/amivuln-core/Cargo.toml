[package]
name = "amivuln-core"
description = "Domain types, matching rules and policy for amivuln. Internal crate: no API stability."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["security", "cve", "vulnerability", "linux"]
categories = ["command-line-utilities"]

[dependencies]
amivuln-version = { path = "../amivuln-version", version = "0.2.0" }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
