[package]
name = "amivuln-cache"
description = "SQLite-backed HTTP cache for amivuln. Internal crate: no API stability."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["security", "cve", "vulnerability", "linux"]
categories = ["command-line-utilities"]

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
sha2 = { version = "0.11.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
minisign-verify = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
minisign = { workspace = true }

[lints]
workspace = true
