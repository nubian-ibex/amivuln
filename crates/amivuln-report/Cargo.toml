[package]
name = "amivuln-report"
description = "Output formatters (summary, detail, JSON) for amivuln. Internal crate: no API stability."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["security", "cve", "vulnerability", "linux"]
categories = ["command-line-utilities"]

[dependencies]
amivuln-core = { path = "../amivuln-core", version = "0.4.0" }
amivuln-version = { path = "../amivuln-version", version = "0.4.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }

[lints]
workspace = true
