[package]
name = "amivuln-sources"
description = "Parsers and HTTP client for the vulnerability data sources used by amivuln. Internal crate: no API stability."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords = ["security", "cve", "vulnerability", "linux"]
categories = ["command-line-utilities"]

[dependencies]
amivuln-core = { path = "../amivuln-core", version = "0.0.3" }
amivuln-version = { path = "../amivuln-version", version = "0.0.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = "0.42.0"
sha2 = { version = "0.11.1", default-features = false }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }
amivuln-cache = { path = "../amivuln-cache", version = "0.0.3" }

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "macros"] }

[lints]
workspace = true
