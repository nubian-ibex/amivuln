[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]
default-members = ["crates/amivuln"]

[workspace.dependencies]
minisign = "0.10.0"
minisign-verify = "0.3.0"
tar = "0.4.44"
zstd = "0.13.3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nubian-ibex/amivuln"
homepage = "https://ibexwall.com/amivuln/"
documentation = "https://ibexwall.com/amivuln/"
authors = ["amivuln contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.dist]
inherits = "release"
