
# cargo-vet audits file

[[audits.bzip2-rs]]
who = "Esl1h <13988295+Esl1h@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.1.2"
notes = "Pure Rust bzip2 decoder, 1,657 lines. forbid(unsafe_code); no build script; no file, network, process or environment access beyond the Read it wraps (the only std::fs and include_bytes are in tests and docs). Not read line by line: checked by grep, and by feeding 300 truncated and bit-flipped copies of Red Hat's 10 MB OVAL file, all returned an error without a panic."

