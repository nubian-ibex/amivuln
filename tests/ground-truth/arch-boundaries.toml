# Regression corpus built from real Arch Security Tracker groups recorded on 2026-11-08.
# Every Fixed group is probed at its boundaries: one build before the fixed version (affected),
# the fixed version itself, and a later build (both clean). Installs older than the version the
# group starts at are outside it. Vulnerable groups cover the stale-entry rule (same upstream
# version affected, newer upstream only unverified). Versions come from the tracker itself.
distro = "arch"

[[case]]
name = "dovecot: build the group lists as affected (AVG-2777)"
package = "dovecot"
version = "2.3.19.1-1"
expect = ["CVE-2022-30550"]

[[case]]
name = "dovecot: exactly the fixed build (AVG-2777)"
package = "dovecot"
version = "2.3.20-1"
forbid = ["CVE-2022-30550"]

[[case]]
name = "dovecot: a later build than the fix (AVG-2777)"
package = "dovecot"
version = "2.3.20-2"
forbid = ["CVE-2022-30550"]

[[case]]
name = "dovecot: older than the range the group covers (AVG-2777)"
package = "dovecot"
version = "0.0.1-1"
forbid = ["CVE-2022-30550"]

