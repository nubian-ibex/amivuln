# Ground truth from an independent oracle: `dnf updateinfo list --security` in a Fedora 45 container
# with these packages installed from the release repo (updates repo disabled for the install).
# The expected fixed version is the NEVRA dnf prints; amivuln must agree on which packages are
# affected and on the version that fixes them, and must report nothing for the negatives.
distro = "fedora:45"

[[case]]
name = "bind-libs has a pending security update"
package = "bind-libs"
expect_fixed_in = "32:9.18.51^git20261003.d0a87358-12.fc45"
version = "32:9.18.50-35.fc45"
expect_affected = true

