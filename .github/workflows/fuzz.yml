name: fuzz
on:
  schedule:
    - cron: "43 5 * * *" # daily, short run
    - cron: "17 6 * * 0" # weekly, one hour per target
  workflow_dispatch:

permissions: {}

jobs:
  short:
    if: ${{ github.event.schedule == '43 5 * * *' || (github.event_name == 'workflow_dispatch' && vars.FUZZ_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [embedded_detect, strings, version_cmp, vex, osv, feeds]
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for a minute
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run "$TARGET" --target x86_64-unknown-linux-gnu -O -- -max_total_time=60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzzer-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

  long:
    if: ${{ (github.event.schedule == '17 6 * * 0' || github.event_name == 'workflow_dispatch') && vars.FUZZ_LONG_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [embedded_detect, strings, version_cmp, vex, osv, feeds]
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for an hour
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run "$TARGET" --target x86_64-unknown-linux-gnu -O -- -max_total_time=3600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzzer-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
