name: distro
# Integration checks against real distributions and real advisory data. They
# need the network, so they are informational (not a required check) and also
# run daily to catch upstream data or format changes.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.*"
      - "tests/distro/**"
      - ".github/workflows/distro.yml"
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A static binary: the UBI 9 image has an older glibc than the runner.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y musl-tools
          cargo build --release --locked -p amivuln --target x86_64-unknown-linux-musl
      - name: Collect the binary and the test script
        run: |
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/amivuln tests/distro/run.sh out/
          # A Gentoo image carries no Portage tree: these advisories stand in.
          cp -r tests/fixtures/glsa out/glsa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distro-test
          path: out
          if-no-files-found: error

  inventory:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: distro-test
          path: out
      - name: Deterministic CVE answers from a fixed inventory
        run: |
          chmod +x out/amivuln
          PATH="$PWD/out:$PATH" sh out/run.sh inventory

  host:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:44", setup: "dnf install -y -q jq ca-certificates" }
          - { image: "archlinux:base", setup: "pacman -Sy --noconfirm jq ca-certificates" }
          - { image: "registry.access.redhat.com/ubi9/ubi:9.6", setup: "dnf install -y -q jq ca-certificates" }
          - { image: "registry.opensuse.org/opensuse/leap:16.0", setup: "zypper --non-interactive install -y jq ca-certificates" }
          - { image: "alpine:3.20", setup: "apk add --no-cache jq ca-certificates" }
          - { image: "ubuntu:24.04", setup: "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qq -y jq ca-certificates" }
          - { image: "debian:stable", setup: "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qq -y jq ca-certificates" }
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: distro-test
          path: /opt/distro-test
      - name: Install jq and the trust bundle
        env:
          SETUP: ${{ matrix.setup }}
        run: sh -c "$SETUP"
      - name: Resolvers and commands against this distribution
        run: |
          chmod +x /opt/distro-test/amivuln
          PATH="/opt/distro-test:$PATH" sh /opt/distro-test/run.sh host

  container:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        image:
          # The runner is Ubuntu, so Fedora and Arch images are also the
          # cross-distribution case: their data is not the host's.
          - fedora:44
          - archlinux:base
          - registry.access.redhat.com/ubi9/ubi:9.6
          - registry.opensuse.org/opensuse/leap:16.0
          - registry.opensuse.org/opensuse/tumbleweed
          - docker.io/gentoo/stage3:amd64-openrc-20261109
          - debian:stable
          - ubuntu:24.04
          - alpine:3.20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: distro-test
          path: out
      # The package databases of Fedora, Red Hat and Arch images are read with
      # the host's rpm and pacman.
      - run: sudo apt-get update -qq && sudo apt-get install -qq -y rpm jq pacman-package-manager
      - name: An image is read, and a container with no packages is an error
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          chmod +x out/amivuln
          # amivuln prefers podman when both runtimes exist, so the container is created with it.
          id=$(podman create "$IMAGE")
          rc=0
          # A Gentoo image has no Portage tree, so its advisories come from a directory.
          printf '[sources.distro]\npath = "%s"\n' "$PWD/out/glsa" >glsa.toml
          out/amivuln --config glsa.toml check --container "$id" --format json >container.json 2>container.err || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 1 ]; then
            echo "exit code $rc"
            cat container.err
            jq -c '{complete, unresolved, sources: [.sources[] | select(.status != "ok")]}' container.json || true
            exit 1
          fi
          jq -e '(.targets | length) > 10 and .complete' container.json
