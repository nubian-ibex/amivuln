name: zizmor
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: "zizmor" }
      - name: actionlint
        uses: rhysd/actionlint@e01e0e0a5e98f47ab0b4d0d3b1fabef46ba58a26 # v1.7.12 wrapped by the official action
      - name: Run zizmor
        run: zizmor --min-severity medium .github/workflows
