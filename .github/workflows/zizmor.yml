name: zizmor
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: "zizmor" }
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Run zizmor
        run: zizmor --min-severity medium .github/workflows
