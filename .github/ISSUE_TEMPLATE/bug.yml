name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: amivuln_version_and_distro
    attributes:
      label: amivuln version and distro
    validations:
      required: true
