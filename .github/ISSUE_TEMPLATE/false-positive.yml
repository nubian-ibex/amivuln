name: False positive
description: A CVE is reported but the distro already fixed it
labels: [false-positive]
body:
  - type: textarea
    id: distro_and_version
    attributes:
      label: Distro and version
    validations:
      required: true
  - type: textarea
    id: package_and_installed_version
    attributes:
      label: Package and installed version
    validations:
      required: true
  - type: textarea
    id: output_of_amivuln_format_json
    attributes:
      label: Output of amivuln --format json
    validations:
      required: true
  - type: textarea
    id: evidence_of_the_patch_changelog_advisory_link
    attributes:
      label: Evidence of the patch (changelog, advisory link)
    validations:
      required: true
