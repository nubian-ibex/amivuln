rules:
  # release.yml is generated by dist: container images come from its computed
  # matrix and the remaining template expansions use dist-controlled values.
  # Tracked as a maintainer decision; see the project notes.
  unpinned-images:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
