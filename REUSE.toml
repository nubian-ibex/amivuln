version = 1

[[annotations]]
path = [
  "**/*.md", "**/*.toml", "**/*.yml", "**/*.yaml", "**/*.json", "**/*.lock",
  ".editorconfig", ".gitignore", "justfile", "CITATION.cff",
  "assets/**", "tests/fixtures/**", "tests/ground-truth/**", "supply-chain/**", "docs/book/**", "contrib/**", "bench/truth/**", "crates/*/tests/*.txt", "crates/*/locales/*.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 amivuln contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Third-party schemas, copied unmodified so the tests can validate the SBOM and
# VEX output offline: the CycloneDX specification at 6470e34 and the OpenVEX
# specification at 93139bd.
[[annotations]]
path = ["tests/vendor/schemas/bom-1.6.schema.json", "tests/vendor/schemas/spdx.schema.json", "tests/vendor/schemas/jsf-0.82.schema.json"]
precedence = "override"
SPDX-FileCopyrightText = "OWASP Foundation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/vendor/schemas/openvex_json_schema.json"
precedence = "override"
SPDX-FileCopyrightText = "The OpenVEX Authors"
SPDX-License-Identifier = "Apache-2.0"

# Gentoo Linux Security Advisories, copied unmodified from the glsa repository
# (data/glsa.git at c8ac65a): each file says "Licensed under CC-BY-SA-4.0".
[[annotations]]
path = "tests/fixtures/glsa/*.xml"
precedence = "override"
SPDX-FileCopyrightText = "Gentoo Authors"
SPDX-License-Identifier = "CC-BY-SA-4.0"
